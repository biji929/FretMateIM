{% load static %}
<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FretMate – {% block page_title %}Welcome{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
</head>
<body class="min-h-screen bg-gradient-to-br from-gray-950 via-gray-900 to-blue-950 text-white flex items-center justify-center px-4">

    <!-- Decorative blobs -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none">
        <div class="absolute -top-32 -left-32 w-96 h-96 bg-blue-600/20 rounded-full blur-3xl"></div>
        <div class="absolute -bottom-32 -right-32 w-96 h-96 bg-purple-600/20 rounded-full blur-3xl"></div>
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-64 h-64 bg-indigo-700/10 rounded-full blur-2xl"></div>
    </div>

    <div class="relative z-10 w-full max-w-md">
        <!-- Logo / Brand -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-blue-600 shadow-lg mb-4 text-3xl">🎸</div>
            <h1 class="text-3xl font-black tracking-tight">FretMate</h1>
            <p class="text-gray-400 text-sm mt-1">Your Guitar Practice Companion</p>
        </div>

        <!-- Card -->
        <div class="bg-white/5 backdrop-blur border border-white/10 rounded-2xl p-8 shadow-2xl">
            {% block auth_content %}{% endblock %}
        </div>

        <!-- Footer note -->
        <p class="text-center text-xs text-gray-600 mt-6">© FretMate · Practice smarter, play better</p>
    </div>

    <script>
        const html = document.documentElement;
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            html.classList.add('dark');
        }
    </script>
</body>
</html>

{% extends 'base.html' %}
{% block content %}
<h2 class="text-3xl font-bold mb-6">Chord Library</h2>
<div class="grid grid-cols-1 md:grid-cols-4 gap-6">
    {% for chord in chords %}
    <div class="bg-white dark:bg-gray-800 p-4 rounded shadow">
        <h4 class="font-bold text-lg">{{ chord.name }}</h4>
        <p>Genre: {{ chord.genre }}</p>
        <p>Difficulty: {{ chord.difficulty }}</p>
        <svg viewBox="0 0 100 120" class="w-32 h-32 mx-auto">
            <!-- Simplified Chord Diagram SVG -->
            <rect x="20" y="20" width="60" height="80" fill="none" stroke="currentColor"/>
            <line x1="30" y1="20" x2="30" y2="100" stroke="currentColor"/>
            <line x1="40" y1="20" x2="40" y2="100" stroke="currentColor"/>
            <line x1="50" y1="20" x2="50" y2="100" stroke="currentColor"/>
            <line x1="60" y1="20" x2="60" y2="100" stroke="currentColor"/>
            <line x1="70" y1="20" x2="70" y2="100" stroke="currentColor"/>
        </svg>
    </div>
    {% endfor %}
</div>
{% endblock %}

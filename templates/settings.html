{% extends 'base.html' %}
{% block content %}
<div class="max-w-md mx-auto bg-white dark:bg-gray-800 p-8 rounded shadow">
    <h2 class="text-2xl font-bold mb-6">Settings</h2>
    <form method="post">
        {% csrf_token %}
        <div class="mb-4">
            <label class="block mb-2">Skill Level</label>
            <select name="skill_level" class="w-full p-2 border rounded dark:bg-gray-700">
                <option value="Beginner">Beginner</option>
                <option value="Intermediate">Intermediate</option>
                <option value="Advanced">Advanced</option>
            </select>
        </div>
        <div class="mb-4">
            <label class="block mb-2">Weekly Goal (minutes)</label>
            <input type="number" name="weekly_goal" value="120" class="w-full p-2 border rounded dark:bg-gray-700">
        </div>
        <button type="submit" class="w-full bg-blue-500 text-white p-2 rounded">Save Settings</button>
    </form>
</div>
{% endblock %}
